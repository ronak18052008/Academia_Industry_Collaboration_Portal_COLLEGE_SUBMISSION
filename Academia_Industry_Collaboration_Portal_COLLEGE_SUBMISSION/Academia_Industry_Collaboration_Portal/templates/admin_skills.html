{% extends 'base.html' %}{% block title %}Skill Library{% endblock %}{% block content %}<div class="page-head"><div><span class="eyebrow">SKILL INTELLIGENCE</span><h1>Skill Library</h1><p>Shared skills power assessments, role mapping and matching.</p></div></div><div class="two-col"><div class="panel"><h2>Add skill</h2><form method="post"><label>Name<input name="name" required></label><label>Category<input name="category" value="General"></label><label>Level<select name="level"><option>Beginner</option><option>Intermediate</option><option>Advanced</option></select></label><button class="btn btn-primary">Add Skill</button></form></div><div class="panel"><h2>Library</h2><div class="tag-cloud">{% for s in skills %}<span class="tag">{{s.name}} <small>{{s.category}}</small></span>{% endfor %}</div></div></div>{% endblock %}
