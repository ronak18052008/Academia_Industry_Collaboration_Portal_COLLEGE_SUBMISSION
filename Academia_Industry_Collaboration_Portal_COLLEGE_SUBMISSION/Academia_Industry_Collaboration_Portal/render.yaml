services:
  - type: web
    name: academia-industry-collaboration-portal
    runtime: python
    plan: free
    buildCommand: pip install -r requirements.txt
    startCommand: gunicorn app:app --workers 2 --threads 4 --timeout 120 --access-logfile - --error-logfile -
    healthCheckPath: /healthz
    envVars:
      - key: SECRET_KEY
        generateValue: true
      - key: FLASK_ENV
        value: production
      - key: FLASK_DEBUG
        value: "0"
      - key: GEMINI_API_KEY
        sync: false
      - key: GEMINI_MODEL
        value: gemini-2.5-flash
      - key: UPLOAD_FOLDER
        value: static/uploads
      - key: OTP_DEMO_MODE
        value: "false"
      - key: DATABASE_URL
        fromDatabase:
          name: academia-portal-db
          property: connectionString

databases:
  - name: academia-portal-db
    plan: free
